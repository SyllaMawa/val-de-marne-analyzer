services:
  db:
    image: postgis/postgis:16-3.4
    container_name: valdemarne-db

    environment:
      POSTGRES_DB: valdemarne
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
